name: React Three Engine

on:
  push:
    paths:
      - "react-three-engine/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/react-three-engine.yml"
  pull_request:
    paths:
      - "react-three-engine/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/react-three-engine.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter react-three-engine typecheck

      - name: Build
        run: pnpm --filter react-three-engine build

      - name: Verify serialization
        run: pnpm --filter react-three-engine verify:serialization
